<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Nadin Alycia ❤️</title>
  <link rel="stylesheet" href="gaya.css">
</head>

<body>

  <div class="container">
    <h1>❤️ Untuk Nadin Alycia ❤️</h1>

    <p class="pesan">
      Hai Nadin Alycia 🥺💗<br>
      Aku cuma mau bilang...
      kamu itu spesial banget buat aku.
    </p>

    <button id="musikBtn">🎵 Putar Musik</button>

    <audio id="musik" loop>
      <source src="My%20Heart%20(Lirik)%20~Acha%20%26%20Irwansyah_1747410777664.mp3" type="audio/mpeg">
    </audio>

    <h2>💗 Stiker Buat Kamu 💗</h2>

    <div class="stiker-container">
      <img src="stiker_01.png">
      <img src="stiker_02.png">
      <img src="stiker_03.png">
      <img src="stiker_04.png">
      <img src="stiker_05.png">
      <img src="stiker_06.png">
      <img src="stiker_07.png">
      <img src="stiker_08.png">
      <img src="stiker_09.png">
      <img src="stiker_10.png">
      <img src="stiker_11.png">
      <img src="stiker_12.png">
      <img src="stiker_13.png">
      <img src="stiker_14.png">
      <img src="stiker_15.png">
      <img src="stiker_16.png">
      <img src="stiker_17.png">
      <img src="stiker_18.png">
      <img src="stiker_19.png">
      <img src="stiker_20.png">
    </div>

    <p class="penutup">
      Jangan ngambek lagi yaa 😭❤️
    </p>
  </div>

  <script>
    const btn = document.getElementById("musikBtn");
    const musik = document.getElementById("musik");

    btn.addEventListener("click", () => {
      if (musik.paused) {
        musik.play();
        btn.textContent = "⏸️ Pause Musik";
      } else {
        musik.pause();
        btn.textContent = "🎵 Putar Musik";
      }
    });
  </script>

</body>
</html>
